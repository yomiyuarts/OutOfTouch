<div class="drawn-char2" style="left: 78%; width: 20%;"></div>
<div class="clickme"></div>


    <div class="canvas-wrapper">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
        <div class="loading-spinner"></div>
        <p>Loading experience...</p>
    </div>

    <button id="fullscreen-button" onclick="goFullscreen()">
        <i class="fa-solid fa-expand"></i>
    </button>
</div>

        <div id="unity-warning"></div>

    <script>
        var unityInstance = null;
        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");

            function updateBannerVisibility() {
                warningBanner.style.display =
                    warningBanner.children.length ? "block" : "none";
            }

            var div = document.createElement("div");
            div.textContent = msg;

            if (type === "error") {
                div.style.cssText =
                    "background: red; color: white; padding: 10px;";
            } else if (type === "warning") {
                div.style.cssText =
                    "background: yellow; color: black; padding: 10px;";
            }

            warningBanner.appendChild(div);
            updateBannerVisibility();

            if (type !== "error") {
                setTimeout(function () {
                    if (div.parentNode === warningBanner) {
                        warningBanner.removeChild(div);
                        updateBannerVisibility();
                    }
                }, 5000);
            }
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/4thYear.loader.js";

        var config = {
            arguments: [],
            dataUrl: buildUrl + "/4thYear.data.br",
            frameworkUrl: buildUrl + "/4thYear.framework.js.br",
            codeUrl: buildUrl + "/4thYear.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ReTouch",
            productName: "OutOfTouch",
            productVersion: "0.1.0",
            showBanner: unityShowBanner
        };

        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobile) {
            var meta = document.createElement("meta");
            meta.name = "viewport";
            meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
            document.head.appendChild(meta);

            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";
        }

        document.querySelector("#unity-loading-bar").style.display = "flex";

        var script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {

    }).then(function (instance) {
        unityInstance = instance;
        document.querySelector("#unity-loading-bar").style.display = "none";
        loadSavedDrawing();
    }).catch(function (message) {
        unityShowBanner("Unable to load the Unity experience: " + message, "error");
    });
};

        script.onerror = function () {
            unityShowBanner(
                "Unable to load the Unity loader. Check that Build/4thYear.loader.js exists.",
                "error"
            );
        };

        document.body.appendChild(script);

        function goFullscreen() {
            if (unityInstance) {
                unityInstance.SetFullscreen(1);
            } else {
                var alertBox = document.getElementById("fullscreen-alert");

                if (alertBox) {
                    alertBox.classList.add("show");

                    setTimeout(function () {
                        alertBox.classList.remove("show");
                    }, 5000);
                }
            }
        }
    </script>

    <div class="group" id="experience">
        <h1 class="ending fade-in-element">
            The true ending is what you make it to be.
        </h1>

        <div id="fullscreen-alert">
            Please wait for the experience to load before entering fullscreen.
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="locked-outline" x="-20%" y="-20%" width="140%" height="140%" primitiveUnits="objectBoundingBox">

      <feMorphology operator="dilate" radius="0.03" in="SourceAlpha" result="thicken" />
      <feFlood flood-color="#ededed" result="color" />
      <feComposite in="color" in2="thicken" operator="in" result="outline" />
      <feMerge>
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
</svg>

    <script src="JS/color.js"></script>
    <script src="JS/font.js"></script>
