<script>
    var unityInstance = null;

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
    }

    createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/3rdYear 2ndSem.data",
        frameworkUrl: "Build/3rdYear 2ndSem.framework.js",
        codeUrl: "Build/3rdYear 2ndSem.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "GT2_AsteroidsClone",
        productVersion: "1.0",
    }).then(function(instance) {
        unityInstance = instance;
    }).catch(function(message) {
        alert(message);
    });

    function goFullscreen() {
        if (unityInstance) {
            unityInstance.SetFullscreen(1);
        }
    }
</script>

<h1 class="ending fade-in-element">The true ending is what you make it to be.</h1>

<div class="fullscreen-container">
    <button id="fullscreen-button" onclick="goFullscreen()">
