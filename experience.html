        #unity-warning {

    <script>
        var unityInstance = null;

        var canvas = document.querySelector("#unity-canvas");

        function unityShowBanner(msg, type) {
            var warningBanner = document.querySelector("#unity-warning");

            function updateBannerVisibility() {
                warningBanner.style.display =
                    warningBanner.children.length ? "block" : "none";
            }

            var div = document.createElement("div");
            div.textContent = msg;

            if (type === "error") {
                div.style.cssText =
                    "background: red; color: white; padding: 10px;";
            } else {
                if (type === "warning") {
                    div.style.cssText =
                        "background: yellow; color: black; padding: 10px;";
                }

                setTimeout(function () {
                    if (div.parentNode === warningBanner) {
                        warningBanner.removeChild(div);
                        updateBannerVisibility();
                    }
                }, 5000);
            }

            warningBanner.appendChild(div);
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/4thYear.loader.js";

        var config = {
            arguments: [],
            dataUrl: buildUrl + "/4thYear.data.br",
            frameworkUrl: buildUrl + "/4thYear.framework.js.br",
            codeUrl: buildUrl + "/4thYear.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "ReTouch",
            productName: "OutOfTouch",
            productVersion: "0.1.0",
            showBanner: unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement("meta");

            meta.name = "viewport";
            meta.content =
                "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

            document.head.appendChild(meta);

            document.querySelector("#unity-container").className = "unity-mobile";
            canvas.className = "unity-mobile";

            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            canvas.style.top = "0";
            canvas.style.left = "0";
            canvas.style.zIndex = "1000";

            document.body.style.textAlign = "left";
        } else {
            canvas.style.width = "70%";
            canvas.style.height = "auto";
            canvas.style.aspectRatio = "16 / 9";
        }

        document.querySelector("#unity-loading-bar").style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;


script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress-bar-full").style.width =
            (100 * progress) + "%";
    }).then(function (instance) {
        unityInstance = instance;

        document.querySelector("#unity-loading-bar").style.display = "none";

        loadSavedDrawing();

    }).catch(function (message) {
        unityShowBanner(message, "error");
    });
};


        script.onerror = function () {
            unityShowBanner(
                "Unable to load the Unity loader. Check that Build/4thYear.loader.js exists.",
                "error"
            );
        };

        document.body.appendChild(script);

        function goFullscreen() {
            if (unityInstance) {
                unityInstance.SetFullscreen(1);
            }
        }
    </script>
